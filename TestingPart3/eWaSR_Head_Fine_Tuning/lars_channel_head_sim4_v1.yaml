# LaSR Channel head + sim4 experiment; the source YAML and V2 manifest are read-only.
schema_version: 1
experiment:
  name: lars_channel_head_sim4_v1
  output_dir: outputs/lars_channel_head_sim4_v1
  seed: 4022
split_source:
  definition_yaml: ../DataSource/head_only_lars_channel_staged_v1.yaml
  definition_sha256: a64e4342de5f8fd59184c8381522acc848ebc6fbdc39eccb4b85133851383f0d
  v2_resolved_manifest: ../../results/manifests/lars_channel.json
  manifest_sha256: a35601a872506a928868afabd4ac30eb789cb463835464f8ede0ec879510d725
  expected_counts: {train: 175, validation: 58, test: 44, unseen: 15}
model:
  architecture: ewasr_resnet18
  checkpoint: ../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz
  imu: false
  trainable_modules: [decoder.sim4, decoder.seg_head]
  sim4_batchnorm_mode: eval
  seg_head_batchnorm_mode: train
preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
training:
  optimizer: adamw
  learning_rates: {decoder.seg_head: 0.001, decoder.sim4: 0.00001}
  weight_decay: 0.001
  epochs: 20
  batch_size: 2
  class_weights: [1, 1, 1]
  loss: cross_entropy
  checkpoint_selection_metric: validation_binary_water_iou
