# Pohang left-camera canal + pier, head-only staged experiment (steps 1-6).
# Each recording has 299 consecutively numbered frames. Seven contiguous
# clips per recording are assigned as whole clips to train/validation/test/unseen.
# This yields 358/120/90/30 image-mask pairs, with equal canal/pier counts in
# every role. The 60/20/15/5 fractions are approximate due to integer counts.
# Clips share their parent recordings; adjacent clips can contain near-duplicate
# frames. These are not independent trips.
# The requested Pohang_Canal_5ppt/masks directory is absent locally. The
# available Pohang_Canal/masks set is used; its padding setting is unverified.
schema_version: 1
experiment:
  name: pohang_canal_pier_v2
  output_dir: ../eWaSR_Head_Fine_Tuning/outputs/pohang_canal_pier_v2
  seed: 4022
  description: Head-only eWaSR fine-tuning on whole contiguous Pohang canal/pier clips.

source_inventory:
  canal: {images: 299, first_frame: 1258, last_frame: 1556}
  pier: {images: 299, first_frame: 153, last_frame: 451}
  requested_canal_masks_dir: ../SAM3_Pseudo_Labels_Generator/output/Pohang_Canal_5ppt/masks
  requested_canal_masks_status: absent; the existing Pohang_Canal masks have unknown padding provenance.
  actual_canal_masks_dir: ../SAM3_Pseudo_Labels_Generator/output/Pohang_Canal/masks
  pier_masks_dir: ../SAM3_Pseudo_Labels_Generator/output/Pohang_Pier_5ppt/masks

labels: {obstacle: 0, water: 1, sky: 2}
data:
  train:
    expected_count: 358
    sources:
      - source_id: canal_train_clip_1
        sequence_id: pohang00_canal_frames_001258_to_001317
        images_dir: &canal_images ../../data/pohang00/pohang00_canal/left_images
        masks_dir: &canal_masks ../SAM3_Pseudo_Labels_Generator/output/Pohang_Canal/masks
        expected_count: 60
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 1258, end: 1317}
      - source_id: canal_train_clip_2
        sequence_id: pohang00_canal_frames_001348_to_001407
        images_dir: *canal_images
        masks_dir: *canal_masks
        expected_count: 60
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 1348, end: 1407}
      - source_id: canal_train_clip_3
        sequence_id: pohang00_canal_frames_001453_to_001511
        images_dir: *canal_images
        masks_dir: *canal_masks
        expected_count: 59
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 1453, end: 1511}
      - source_id: pier_train_clip_1
        sequence_id: pohang00_pier_frames_000153_to_000212
        images_dir: &pier_images ../../data/pohang00/pohang00_pier/left_images
        masks_dir: &pier_masks ../SAM3_Pseudo_Labels_Generator/output/Pohang_Pier_5ppt/masks
        expected_count: 60
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 153, end: 212}
      - source_id: pier_train_clip_2
        sequence_id: pohang00_pier_frames_000243_to_000302
        images_dir: *pier_images
        masks_dir: *pier_masks
        expected_count: 60
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 243, end: 302}
      - source_id: pier_train_clip_3
        sequence_id: pohang00_pier_frames_000348_to_000406
        images_dir: *pier_images
        masks_dir: *pier_masks
        expected_count: 59
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 348, end: 406}
  validation:
    expected_count: 120
    sources:
      - source_id: canal_validation_clip_1
        sequence_id: pohang00_canal_frames_001318_to_001347
        images_dir: *canal_images
        masks_dir: *canal_masks
        expected_count: 30
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 1318, end: 1347}
      - source_id: canal_validation_clip_2
        sequence_id: pohang00_canal_frames_001512_to_001541
        images_dir: *canal_images
        masks_dir: *canal_masks
        expected_count: 30
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 1512, end: 1541}
      - source_id: pier_validation_clip_1
        sequence_id: pohang00_pier_frames_000213_to_000242
        images_dir: *pier_images
        masks_dir: *pier_masks
        expected_count: 30
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 213, end: 242}
      - source_id: pier_validation_clip_2
        sequence_id: pohang00_pier_frames_000407_to_000436
        images_dir: *pier_images
        masks_dir: *pier_masks
        expected_count: 30
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 407, end: 436}
  test:
    expected_count: 90
    sources:
      - source_id: canal_test_clip
        sequence_id: pohang00_canal_frames_001408_to_001452
        images_dir: *canal_images
        masks_dir: *canal_masks
        expected_count: 45
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 1408, end: 1452}
      - source_id: pier_test_clip
        sequence_id: pohang00_pier_frames_000303_to_000347
        images_dir: *pier_images
        masks_dir: *pier_masks
        expected_count: 45
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 303, end: 347}
  unseen:  # Reserved heldout split; the staged runner calls this role "unseen".
    expected_count: 30
    sources:
      - source_id: canal_unseen_clip
        sequence_id: pohang00_canal_frames_001542_to_001556
        images_dir: *canal_images
        masks_dir: *canal_masks
        expected_count: 15
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 1542, end: 1556}
      - source_id: pier_unseen_clip
        sequence_id: pohang00_pier_frames_000437_to_000451
        images_dir: *pier_images
        masks_dir: *pier_masks
        expected_count: 15
        selection: {kind: inclusive_range, index_pattern: '^(\d+)$', start: 437, end: 451}

split_policy:
  fractions: {train: 0.60, validation: 0.20, test: 0.15, unseen: 0.05}
  max_fraction_deviation: 0.0014
  counts: {train: 358, validation: 120, test: 90, unseen: 30}
  method: whole contiguous clips distributed across roles within each recording
  independence_scope: Clips from the same recording are correlated; this does not establish independent trips.

model:
  architecture: ewasr_resnet18
  checkpoint: ../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz
  imu: false
  trainable_module: decoder.seg_head
preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
training:
  optimizer: adamw
  initial_learning_rate: 0.001
  learning_rates: [0.0003, 0.001, 0.003]
  weight_decay: 0.0001
  batch_size: 2
  epochs: 10
  loss: cross_entropy
  class_weights: null
  checkpoint_selection_metric: validation_binary_water_iou
