schema_version: 1

experiment:
  name: port_head_only_v1
  description: >-
    Head-only adaptation of non-IMU eWaSR to port-camera imagery in which the
    ASV is not visible. SAM3 masks are the configured target labels for this
    pseudo-label adaptation study.
  output_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/eWaSR_Head_Fine_Tuning/outputs/port_head_only_v1"
  seed: 4022

labels:
  obstacle: 0
  water: 1
  sky: 2

data:
  # Every role is assigned by source recording/dataset, never by randomly
  # sampling adjacent frames from the same recording.
  train:
    sequence_id: mods_kope104_00065550_to_00066030
    expected_count: 98
    sources:
      - source_id: mods_kope104_port
        images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/data/mods/sequences/kope104-00065550-00066030/frames"
        masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/MODS_Port_5ppt/masks"
        expected_count: 98
        selection:
          kind: all

  validation:
    sequence_id: lars_port_external_validation_sources
    expected_count: 35
    sources:
      # These are the original LaRS folders. Their roles are retained in the
      # source IDs, but all are validation-only in this experiment.
      - source_id: lars_val_port
        images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/data/lars_v1-2/val/images/Port"
        masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaRS_Port_5ppt/masks"
        shared_masks_dir: true
        expected_count: 9
        selection:
          kind: all
      - source_id: lars_test_port
        images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/data/lars_v1-2/test/images/Port"
        masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaRS_Port_5ppt/masks"
        shared_masks_dir: true
        expected_count: 23
        selection:
          kind: all
      - source_id: lars_train_port
        images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/data/lars_v1-2/train/images/Port"
        masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaRS_Port_5ppt/masks"
        shared_masks_dir: true
        expected_count: 3
        selection:
          kind: all

  test:
    sequence_id: pohang00_port
    expected_count: 20
    sources:
      # The image folder has more frames, but only these matching 20 frames
      # have SAM3 masks. "all" therefore means all available labelled pairs.
      - source_id: pohang00_port_labelled_frames
        images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/data/pohang00/pohang00_port/left_images"
        masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/Pohang_Port_5ppt/masks"
        expected_count: 20
        selection:
          kind: all

model:
  architecture: ewasr_resnet18
  checkpoint: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz"
  imu: false
  trainable_module: decoder.seg_head
  frozen_modules:
    - backbone
    - decoder.metaformers
    - decoder.metaformers_skip2
    - decoder.sim1
    - decoder.sim2
    - decoder.sim3
    - decoder.sim4
  frozen_batchnorm_affine_parameters: true

preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

training:
  optimizer: adamw
  initial_learning_rate: 0.001
  learning_rates: [0.0003, 0.001, 0.003]
  weight_decay: 0.0001
  batch_size: 2
  epochs: 10
  loss: cross_entropy
  class_weights: null
  checkpoint_selection_metric: validation_mean_iou

methodology_notes:
  pseudo_label_role: >-
    SAM3 masks are treated as the target labels for training, validation and
    this experiment's pseudo-label test evaluation. The final claim of model
    improvement must additionally be checked against independently annotated
    ground-truth masks.
  split_method: >-
    MODS, LaRS and Pohang are separate source recordings/datasets. No random
    frame-level split is performed. The three LaRS Port folders are combined
    only as validation, as explicitly requested.
  test_coverage: >-
    Test uses all 20 Pohang frames that have a matching SAM3 mask, rather than
    the 300 unlabelled images in the source folder.
