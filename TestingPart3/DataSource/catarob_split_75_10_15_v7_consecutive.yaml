# CataRob V7: chronological blocks, sampling every fifth source frame.
# The 75/10/15 denominator is 600 train/validation/test images. The 30-image
# unseen reserve is additional and keeps the V4 membership unchanged.
# Reuses the shared CataRob_V5_V6_5ppt mask pool, including its four generated masks.
# Use train_head.py; run_staged_experiment.py requires a different split policy.
schema_version: 1
dataset: Catarob
experiment:
  name: catarob_v7_consecutive_75_10_15
  output_dir: ../eWaSR_Head_Fine_Tuning/outputs/Catarob_tests/Catarob_V7
  seed: 4022
  description: Consecutive temporal blocks with fixed CataRob test and unseen ranges.
labels: {obstacle: 0, water: 1, sky: 2}
data:
  train:
    expected_count: 450
    sources:
      - sequence_id: catarob_0075_2320
        images_dir: &images ../../data/Catarob/left_frames
        masks_dir: &masks ../SAM3_Pseudo_Labels_Generator/output/CataRob_V5_V6_5ppt/masks
        expected_count: 450
        selection: {kind: every_nth, index_pattern: &frame_index '^left_frame_(\d+)$', start: 75, end: 2320, step: 5}
  validation:
    expected_count: 60
    sources:
      - sequence_id: catarob_2375_2670
        images_dir: *images
        masks_dir: *masks
        expected_count: 60
        selection: {kind: every_nth, index_pattern: *frame_index, start: 2375, end: 2670, step: 5}
  test:
    expected_count: 90
    sources:
      - sequence_id: catarob_2845_3290
        images_dir: *images
        masks_dir: *masks
        expected_count: 90
        selection: {kind: every_nth, index_pattern: *frame_index, start: 2845, end: 3290, step: 5}
  unseen:
    expected_count: 30
    sources:
      - sequence_id: catarob_3385_3530
        images_dir: *images
        masks_dir: *masks
        expected_count: 30
        selection: {kind: every_nth, index_pattern: *frame_index, start: 3385, end: 3530, step: 5}
split_policy:
  fractions: {train: 0.75, validation: 0.10, test: 0.15}
  counts: {train: 450, validation: 60, test: 90}
  unseen_reserved_outside_ratio: 30
pseudo_labels:
  masks_dir: ../SAM3_Pseudo_Labels_Generator/output/CataRob_V5_V6_5ppt/masks
  model: facebook/sam3
  class_prompts: [obstacle, navigable water, sky]
  confidence_threshold: 0.5
  reflection_padding_percent: 5
  newly_generated_frames: []
  reused_generated_frames: [2050, 2055, 2060, 2065]
model:
  architecture: ewasr_resnet18
  checkpoint: ../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz
  imu: false
  trainable_module: decoder.seg_head
preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.001
  batch_size: 2
  epochs: 20
  loss: cross_entropy
  class_weights: [1, 1, 1]
  checkpoint_selection_metric: validation_binary_water_iou
