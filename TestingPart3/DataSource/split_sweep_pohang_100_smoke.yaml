# Dry-run example: 50 consecutive paired frames from each Pohang recording.
# This creates manifests only until split_sweep.py train is explicitly invoked.
schema_version: 1
dataset: pohang_100_smoke
model_checkpoint: ../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz
training_seed: 4022
split_seeds: [4022, 4023, 4024]
subtrip_size: 10
sources:
  - trip_id: pohang_canal
    images_dir: ../../data/pohang00/pohang00_canal/left_images
    masks_dir: ../SAM3_Pseudo_Labels_Generator/output/Pohang_Canal/masks
    frame_pattern: '^(?P<frame>\d+)$'
    first_frame: 1258
    last_frame: 1307
    require_complete_range: true
  - trip_id: pohang_pier
    images_dir: ../../data/pohang00/pohang00_pier/left_images
    masks_dir: ../SAM3_Pseudo_Labels_Generator/output/Pohang_Pier_5ppt/masks
    frame_pattern: '^(?P<frame>\d+)$'
    first_frame: 153
    last_frame: 202
    require_complete_range: true
