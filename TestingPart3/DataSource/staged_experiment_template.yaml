# Copy this file for a dataset and replace every REPLACE_ value before running.
# Use real recording/trip IDs. Each source is one continuous recording group.
# The example counts assume 200 labelled images: 120 / 40 / 30 / 10.
schema_version: 1
experiment:
  name: REPLACE_DATASET_NAME
  output_dir: ../eWaSR_Head_Fine_Tuning/outputs/REPLACE_DATASET_NAME_staged_v1
  seed: 4022
labels:
  obstacle: 0
  water: 1
  sky: 2
data:
  train:
    expected_count: 120
    sources:
      - sequence_id: REPLACE_REAL_TRAIN_RECORDING_ID
        images_dir: REPLACE_TRAIN_IMAGES_DIR
        masks_dir: REPLACE_TRAIN_SAM3_MASKS_DIR
        selection: {kind: all}
  validation:
    expected_count: 40
    sources:
      - sequence_id: REPLACE_REAL_VALIDATION_RECORDING_ID
        images_dir: REPLACE_VALIDATION_IMAGES_DIR
        masks_dir: REPLACE_VALIDATION_SAM3_MASKS_DIR
        selection: {kind: all}
  test:
    expected_count: 30
    sources:
      - sequence_id: REPLACE_REAL_TEST_RECORDING_ID
        images_dir: REPLACE_TEST_IMAGES_DIR
        masks_dir: REPLACE_TEST_SAM3_MASKS_DIR
        selection: {kind: all}
  unseen:
    expected_count: 10
    sources:
      - sequence_id: REPLACE_REAL_UNSEEN_RECORDING_ID
        images_dir: REPLACE_UNSEEN_IMAGES_DIR
        masks_dir: REPLACE_UNSEEN_SAM3_MASKS_DIR
        selection: {kind: all}
split_policy:
  fractions: {train: 0.60, validation: 0.20, test: 0.15, unseen: 0.05}
  # Increase only if whole recording groups cannot meet the exact target.
  max_fraction_deviation: 0.0
model:
  architecture: ewasr_resnet18
  checkpoint: ../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz
  imu: false
  trainable_module: decoder.seg_head
preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
training:
  optimizer: adamw
  initial_learning_rate: 0.001
  learning_rates: [0.0003, 0.001, 0.003]
  weight_decay: 0.0001
  batch_size: 2
  epochs: 10
  loss: cross_entropy
  class_weights: null
  checkpoint_selection_metric: validation_binary_water_iou
