# LaSR Channel, new head-only staged experiment (steps 1-6).
# This is a NEW 60/20/15/5 assignment across all 292 Channel image/mask pairs.
# The native LaSR folder split is recorded below, but whole davimar_seq_* groups
# are reassigned to the four staged roles. In particular, 35 images from the
# native test folder enter staged training; do not use the old native-test score
# as a held-out result for this new experiment.
schema_version: 1
experiment:
  name: lars_channel_staged_v1
  output_dir: ../eWaSR_Head_Fine_Tuning/outputs/lars_channel_staged_v1
  seed: 4022
  description: Head-only eWaSR tuning on LaSR Channel with whole-sequence splits.

source_inventory:
  native_train: {folder: train/images/Channel, images: 140, sequences: 34}
  native_validation: {folder: val/images/Channel, images: 15, sequences: 5}
  native_test: {folder: test/images/Channel, images: 137, sequences: 32}
  pseudo_masks: TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaSR_Channel_5ppt/{train,val,test}/masks
  grouping: davimar_seq number from each image filename; all frames of a sequence stay in one staged role.

labels: {obstacle: 0, water: 1, sky: 2}
data:
  train:
    expected_count: 175
    sources:
      - source_id: native_train_sequences
        images_dir: ../../data/lars_v1-2/train/images/Channel
        masks_dir: ../SAM3_Pseudo_Labels_Generator/output/LaSR_Channel_5ppt/train/masks
        expected_count: 140
        selection:
          kind: sequence_ids
          pattern: '^(davimar_seq_\d+)_\d+$'
          ids: [davimar_seq_01, davimar_seq_03, davimar_seq_04, davimar_seq_05,
                davimar_seq_06, davimar_seq_07, davimar_seq_13, davimar_seq_14,
                davimar_seq_15, davimar_seq_16, davimar_seq_17, davimar_seq_18,
                davimar_seq_19, davimar_seq_20, davimar_seq_21, davimar_seq_22,
                davimar_seq_23, davimar_seq_24, davimar_seq_25, davimar_seq_33,
                davimar_seq_38, davimar_seq_43, davimar_seq_47, davimar_seq_48,
                davimar_seq_49, davimar_seq_50, davimar_seq_54, davimar_seq_58,
                davimar_seq_59, davimar_seq_60, davimar_seq_64, davimar_seq_65,
                davimar_seq_66, davimar_seq_67]
      - source_id: reassigned_native_test_sequences
        images_dir: &test_images ../../data/lars_v1-2/test/images/Channel
        masks_dir: &test_masks ../SAM3_Pseudo_Labels_Generator/output/LaSR_Channel_5ppt/test/masks
        expected_count: 35
        selection:
          kind: sequence_ids
          pattern: '^(davimar_seq_\d+)_\d+$'
          ids: [davimar_seq_09, davimar_seq_26, davimar_seq_28, davimar_seq_31,
                davimar_seq_35, davimar_seq_39, davimar_seq_51, davimar_seq_56]
  validation:
    expected_count: 58
    sources:
      - source_id: native_validation_sequences
        images_dir: ../../data/lars_v1-2/val/images/Channel
        masks_dir: ../SAM3_Pseudo_Labels_Generator/output/LaSR_Channel_5ppt/val/masks
        expected_count: 15
        selection:
          kind: sequence_ids
          pattern: '^(davimar_seq_\d+)_\d+$'
          ids: [davimar_seq_08, davimar_seq_36, davimar_seq_42, davimar_seq_69,
                davimar_seq_70]
      - source_id: reassigned_native_test_sequences
        images_dir: *test_images
        masks_dir: *test_masks
        expected_count: 43
        selection:
          kind: sequence_ids
          pattern: '^(davimar_seq_\d+)_\d+$'
          ids: [davimar_seq_10, davimar_seq_40, davimar_seq_44, davimar_seq_45,
                davimar_seq_55, davimar_seq_57, davimar_seq_62, davimar_seq_63,
                davimar_seq_68]
  test:
    expected_count: 44
    sources:
      - source_id: held_out_native_test_sequences
        images_dir: *test_images
        masks_dir: *test_masks
        expected_count: 44
        selection:
          kind: sequence_ids
          pattern: '^(davimar_seq_\d+)_\d+$'
          ids: [davimar_seq_02, davimar_seq_12, davimar_seq_27, davimar_seq_30,
                davimar_seq_32, davimar_seq_34, davimar_seq_37, davimar_seq_41,
                davimar_seq_46, davimar_seq_52, davimar_seq_61, davimar_seq_71]
  unseen:
    expected_count: 15
    sources:
      - source_id: final_unseen_native_test_sequences
        images_dir: *test_images
        masks_dir: *test_masks
        expected_count: 15
        selection:
          kind: sequence_ids
          pattern: '^(davimar_seq_\d+)_\d+$'
          ids: [davimar_seq_11, davimar_seq_29, davimar_seq_53]

split_policy:
  fractions: {train: 0.60, validation: 0.20, test: 0.15, unseen: 0.05}
  max_fraction_deviation: 0.0
  assignment: Whole filename sequence IDs, deterministic seed 4022; no sequence crosses staged roles.
  counts: {train: 175, validation: 58, test: 44, unseen: 15}

model:
  architecture: ewasr_resnet18
  checkpoint: ../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz
  imu: false
  trainable_module: decoder.seg_head
preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
training:
  optimizer: adamw
  initial_learning_rate: 0.001
  learning_rates: [0.0003, 0.001, 0.003]
  weight_decay: 0.0001
  batch_size: 2
  epochs: 10
  loss: cross_entropy
  class_weights: null
  checkpoint_selection_metric: validation_binary_water_iou
