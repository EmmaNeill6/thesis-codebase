# CataRob chronological split: 600 frames in four ascending stride-five blocks.
# The original 90-frame test and 30-frame unseen blocks form one 120-frame test split.
# Additional SAM3 pseudo-labels fill gaps in the train and validation blocks.
schema_version: 1
experiment:
  name: catarob_chronological_head_only_60_20_20_v1
  output_dir: ../eWaSR_Head_Fine_Tuning/outputs/catarob_chronological_head_only_60_20_20_v1
  seed: 4022
  description: Head-only eWaSR on 600 chronological CataRob frames with combined test and unseen blocks.

labels: {obstacle: 0, water: 1, sky: 2}
data:
  train:
    sequence_id: catarob_0075_1870
    images_dir: &images ../../data/Catarob/left_frames
    masks_dir: &masks ../SAM3_Pseudo_Labels_Generator/output/CataRob_Chronological_5ppt/masks
    expected_count: 360
    selection: {kind: every_nth, index_pattern: &frame_index '^left_frame_(\d+)$', start: 75, end: 1870, step: 5}
  validation:
    sequence_id: catarob_2220_2815
    images_dir: *images
    masks_dir: *masks
    expected_count: 120
    selection: {kind: every_nth, index_pattern: *frame_index, start: 2220, end: 2815, step: 5}
  test:
    expected_count: 120
    sources:
      - sequence_id: catarob_2845_3290
        images_dir: *images
        masks_dir: *masks
        expected_count: 90
        selection: {kind: every_nth, index_pattern: *frame_index, start: 2845, end: 3290, step: 5}
      - sequence_id: catarob_3385_3530
        images_dir: *images
        masks_dir: *masks
        expected_count: 30
        selection: {kind: every_nth, index_pattern: *frame_index, start: 3385, end: 3530, step: 5}

split_policy:
  fractions: {train: 0.60, validation: 0.20, test: 0.20}
  max_fraction_deviation: 0.0
  counts: {train: 360, validation: 120, test: 120}
  assignment: Train and validation use ascending frame-index blocks; test combines the two original held-out blocks, selecting every fifth frame from each block start.
  limitation: Gaps remain between the four blocks; adjacent sampled frames within each block are five source frames apart.

pseudo_labels:
  model: facebook/sam3
  class_prompts: [obstacle, navigable water, sky]
  confidence_threshold: 0.5
  reflection_padding_percent: 5
  generated_for_this_split: {train: 65, validation: 4, test: 0}

model:
  architecture: ewasr_resnet18
  checkpoint: ../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz
  imu: false
  trainable_module: decoder.seg_head
preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]
training:
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.001
  batch_size: 2
  epochs: 20
  loss: cross_entropy
  class_weights: [1, 1, 1]
  checkpoint_selection_metric: validation_binary_water_iou
