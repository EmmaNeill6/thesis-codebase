schema_version: 1

experiment:
  name: tampere_channel_head_only_v1
  description: >-
    First head-only eWaSR fine-tuning experiment using SAM3 three-class
    pseudo-labels, chronological Tampere blocks, and a separate CataRob trip.
  output_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/eWaSR_Head_Fine_Tuning/outputs/tampere_channel_head_only_v1"
  seed: 4022

labels:
  obstacle: 0
  water: 1
  sky: 2

data:
  train:
    sequence_id: tampere_channel_frames_001_to_150
    images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/data/Tampere-WaterSeg/images/channel"
    masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/Tampere_Channel_5ppt/masks"
    expected_count: 150
    selection:
      kind: inclusive_range
      index_pattern: '^channel_image_(\d+)$'
      start: 1
      end: 150

  validation:
    sequence_id: tampere_channel_frames_151_to_200
    images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/data/Tampere-WaterSeg/images/channel"
    masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/Tampere_Channel_5ppt/masks"
    expected_count: 50
    selection:
      kind: inclusive_range
      index_pattern: '^channel_image_(\d+)$'
      start: 151
      end: 200

  test:
    sequence_id: catarob_2025_03_27_channel_every_30th_frame
    images_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/CataRob/zed_camera_export_2025_03_27-10_00_09/left_frames"
    masks_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/CataRob_Channel_5ppt/masks"
    expected_count: 50
    selection:
      kind: every_nth
      index_pattern: '^left_frame_(\d+)$'
      start: 0
      end: 1470
      step: 30

model:
  architecture: ewasr_resnet18
  checkpoint: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz"
  imu: false
  trainable_module: decoder.seg_head
  frozen_modules:
    - backbone
    - decoder.metaformers
    - decoder.metaformers_skip2
    - decoder.sim1
    - decoder.sim2
    - decoder.sim3
    - decoder.sim4

preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

training:
  optimizer: adamw
  initial_learning_rate: 0.001
  learning_rates: [0.0003, 0.001, 0.003]
  weight_decay: 0.0001
  batch_size: 2
  epochs: 10
  loss: cross_entropy
  class_weights: null
  checkpoint_selection_metric: validation_mean_iou

methodology_notes:
  requested_but_rejected_mask_dir: "/Users/user/Documents/Documents - User’s MacBook Pro/EEE4022S/thesis-codebase/TestingPart3/SAM3_Pseudo_Labels_Generator/output/Tampere_Open-padded-5pct/masks"
  correction_reason: >-
    The requested directory contains open_image masks generated from different
    source images and cannot be paired with channel_image inputs. Matching
    channel_image masks already exist in Tampere_Channel_5ppt/masks.
  split_limitation: >-
    The training and validation blocks are chronological but come from the
    same named Tampere channel sequence. The CataRob test set is a separate
    recording. Test masks are SAM3 pseudo-labels, not independent human ground
    truth, so test metrics measure agreement with SAM3.
