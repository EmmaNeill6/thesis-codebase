schema_version: 1

experiment:
  name: lars_asv_visible_channel_head_only_v1
  description: >-
    Head-only adaptation of pretrained non-IMU eWaSR to channel imagery with
    the ASV visible in the frame, using SAM3 three-class pseudo-labels.
  output_dir: "../../TestingPart3/eWaSR_Head_Fine_Tuning/outputs/lars_asv_visible_channel_head_only_v1"
  seed: 4022

labels:
  obstacle: 0
  water: 1
  sky: 2

data:
  train:
    sequence_id: lars_test_asv_channel_folders
    expected_count: 110
    sources:
      - source_id: lars_test_asv_channel
        images_dir: "../../data/lars_v1-2/test/images/ASV_Channel"
        masks_dir: "../../TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaSR_ASV_Channel_5pct/masks"
        shared_masks_dir: true
        expected_count: 2
        selection:
          kind: all
      - source_id: lars_test_asv_channel_2
        images_dir: "../../data/lars_v1-2/test/images/ASV_Channel_2"
        masks_dir: "../../TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaSR_ASV_Channel_5pct/masks"
        shared_masks_dir: true
        expected_count: 83
        selection:
          kind: all
      - source_id: lars_test_asv_channel_3
        images_dir: "../../data/lars_v1-2/test/images/ASV_Channel_3"
        masks_dir: "../../TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaSR_ASV_Channel_5pct/masks"
        shared_masks_dir: true
        expected_count: 23
        selection:
          kind: all
      - source_id: lars_test_asv_channel_4
        images_dir: "../../data/lars_v1-2/test/images/ASV_Channel_4"
        masks_dir: "../../TestingPart3/SAM3_Pseudo_Labels_Generator/output/LaSR_ASV_Channel_5pct/masks"
        shared_masks_dir: true
        expected_count: 2
        selection:
          kind: all

  validation:
    sequence_id: tampere_channel
    images_dir: "../../data/Tampere-WaterSeg/images/channel"
    masks_dir: "../../TestingPart3/SAM3_Pseudo_Labels_Generator/output/Tampere_Channel_5ppt/masks"
    expected_count: 200
    selection:
      kind: all

  test:
    sequence_id: catarob_2025_03_27_channel_labelled_frames
    images_dir: "../../data/Catarob/left_frames"
    masks_dir: "../../TestingPart3/SAM3_Pseudo_Labels_Generator/output/CataRob_Channel_5ppt/masks"
    expected_count: 50
    selection:
      kind: all

model:
  architecture: ewasr_resnet18
  checkpoint: "../../TestingPart1/eWaSR/Pretrained/ewasr_resnet18_mlx.npz"
  imu: false
  trainable_module: decoder.seg_head
  frozen_modules:
    - backbone
    - decoder.metaformers
    - decoder.metaformers_skip2
    - decoder.sim1
    - decoder.sim2
    - decoder.sim3
    - decoder.sim4
  frozen_batchnorm_affine_parameters: true

preprocessing:
  input_width: 512
  input_height: 384
  mask_width: 128
  mask_height: 96
  mask_interpolation: nearest
  image_normalization: imagenet
  image_mean: [0.485, 0.456, 0.406]
  image_std: [0.229, 0.224, 0.225]

training:
  optimizer: adamw
  initial_learning_rate: 0.001
  learning_rates: [0.001]
  weight_decay: 0.0001
  batch_size: 2
  epochs: 10
  loss: cross_entropy
  class_weights: null
  checkpoint_selection_metric: validation_mean_iou

methodology_notes:
  pseudo_label_role: >-
    SAM3 masks are the target labels for training and the references for
    validation and test. Metrics report agreement with SAM3 pseudo-labels.
  split_method: >-
    Only the four specified LaRS test/images/ASV_Channel folders train the
    model. Tampere channel is external validation. CataRob is held out for
    one final test evaluation after selection by validation mean IoU.
  test_coverage: >-
    Only CataRob frames with matching SAM3 masks are evaluated.
